<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="layout">
<div class="sidebar">
  <h2>Admin</h2>
</div>

<div class="main">
<h1>Pending Requests</h1>

{% if students|length == 0 %}
<div class="card">No pending requests</div>
{% endif %}

{% for s in students %}
<div class="card">
  <b>{{ s[1] }}</b> ({{ s[2] }})<br>
  Pending requests: {{ s[3] }}<br><br>
  <a class="button" href="/admin/student/{{ s[0] }}">View Requests</a>
</div>
{% endfor %}

</div>
</div>

</body>
</html>
